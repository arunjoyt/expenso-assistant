[project]
name = "expenso-assistant"
version = "0.2.0"
description = "Standalone Assistant service for Expenso — LangGraph agent + FastMCP external adapter"
readme = "README.md"
requires-python = ">=3.12"
# The LangGraph agent is the service's core as of P6-S5, so its dependencies are
# no longer an optional group.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "fastmcp>=4.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langgraph>=1.2",
    "langchain>=1.4",
    "langchain-core>=1.6",
    "langchain-openai>=1.6",
    "langgraph-checkpoint-postgres>=3.1",
    "psycopg[binary,pool]>=3.2",
    "langsmith>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expenso_assistant"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".agents"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
