# Internal SSE-aware proxy only — NOT a TLS endpoint. Traefik (frappe-bench's
# proxy, on the VPS) terminates TLS for assistant.<site> and forwards plain
# HTTP here over the shared `traefik-proxy` network; see docker-compose.yml
# and vps-ref-contabo's RUNBOOK.md. Langfuse is not proxied.

server {
    listen 80;
    server_name _;

    # SSE: no buffering, long read timeout for a streamed run.
    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Set by Traefik upstream — trust it rather than hardcoding, since
        # this server itself only ever speaks plain HTTP.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
